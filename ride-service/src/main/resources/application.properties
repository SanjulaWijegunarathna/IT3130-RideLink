server.port=8083
spring.application.name=ride-service

# MongoDB Connection
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=ridelink_rides
spring.data.mongodb.auto-index-creation=true

ridelink.jwt.secret=${RIDELINK_JWT_SECRET:RideLinkDemoSecretKeyForJwtSigningMustBeLongEnough123}
ridelink.driver-service-url=${DRIVER_SERVICE_URL:http://localhost:8082}
ridelink.fare-service-url=${FARE_SERVICE_URL:http://localhost:8084}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
