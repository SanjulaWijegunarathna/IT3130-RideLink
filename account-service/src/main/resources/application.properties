server.port=8081
spring.application.name=account-service

# MongoDB Connection
spring.mongodb.uri=mongodb://localhost:27017/ridelink_accounts
spring.mongodb.database=ridelink_accounts
spring.data.mongodb.uri=mongodb://localhost:27017/ridelink_accounts
spring.data.mongodb.database=ridelink_accounts
spring.data.mongodb.auto-index-creation=true

# Demo secret only — override with RIDELINK_JWT_SECRET env var in real deployments
ridelink.jwt.secret=${RIDELINK_JWT_SECRET:RideLinkDemoSecretKeyForJwtSigningMustBeLongEnough123}
ridelink.jwt.expiration-ms=86400000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
