server.port=8082
spring.application.name=driver-service

# MongoDB Connection
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=ridelink_drivers
spring.data.mongodb.auto-index-creation=true

# Demo secret only — override with RIDELINK_JWT_SECRET env var in real deployments
ridelink.jwt.secret=${RIDELINK_JWT_SECRET:RideLinkDemoSecretKeyForJwtSigningMustBeLongEnough123}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
