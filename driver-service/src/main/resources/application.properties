server.port=8082
spring.application.name=driver-service

spring.datasource.url=jdbc:h2:mem:driverdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Demo secret only — override with RIDELINK_JWT_SECRET env var in real deployments
ridelink.jwt.secret=${RIDELINK_JWT_SECRET:RideLinkDemoSecretKeyForJwtSigningMustBeLongEnough123}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
