server.port=8084
spring.application.name=fare-payment-service

# MongoDB Connection
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=ridelink_fares
spring.data.mongodb.auto-index-creation=true

# Demo secret
ridelink.jwt.secret=${RIDELINK_JWT_SECRET:RideLinkDemoSecretKeyForJwtSigningMustBeLongEnough123}
ridelink.jwt.expiration-ms=86400000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

